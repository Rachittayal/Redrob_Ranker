# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Two-phase system: precompute.py builds skill/title frequency and IDF maps offline
  from the full 100K pool; rank.py loads these artifacts and scores all candidates
  at runtime (~46s for 100K on CPU, well within the 5-minute budget).

  The JD is fixed for the competition, so its requirements are hand-encoded into
  structured config (jd_config.py) rather than parsed automatically — must-have
  skills, explicit disqualifiers (pure-research-only, pure-consulting-only career,
  CV/speech-dominant without NLP/IR exposure, stale-coder, title-chasing), and an
  "ideal candidate" profile, all traceable to specific JD statements.

  Final score is a transparent weighted sum of five components: career evidence
  (0.35, weighted toward career_history descriptions over job titles, since the
  dataset deliberately decorrelates the two), skills (0.25, tiered by JD-relevance
  and corroborated against endorsements/duration and, where available, platform-
  verified skill_assessment_scores), experience fit (0.15, years + tenure
  stability), availability (0.15, activity/response-rate/notice-period as a bounded
  modifier, not a multiplier that can zero out a strong candidate), and trust/
  completeness (0.10). Hard-set weights rather than a learned ranker, since no
  labeled relevance data is available during the competition.

  Honeypot detection (honeypot.py) uses two threshold-validated structural checks
  (impossible skill-duration/proficiency combinations; current-role duration
  exceeding total stated experience) confirmed via sensitivity sweeps across the
  full 100K pool. Flagged candidates are excluded outright before scoring.

  Reasoning is templated from actual computed score components and profile fields
  — never freely generated — to avoid hallucinated claims at Stage 4 review.

